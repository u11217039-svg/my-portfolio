<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放學後社團體驗表</title>
</head>
<body>
  <h1>放學後社團體驗表</h1>
  <p>這是介面練習，資料不會送出或保存，不能當成正式報名。</p>
  <!-- 本次使用獨立表單元件練習；沒有提交表單，也沒有資料儲存功能。 -->

  <p>
    <label for="nickname">我的暱稱</label><br>
    <input id="nickname" name="nickname" type="text" placeholder="例如：小星星">
  </p>

  <p>
    <label for="club">想體驗的社團</label><br>
    <select id="club" name="club">
      <option value="">請選擇社團</option>
      <option value="story">故事劇場</option>
      <option value="science">科學手作</option>
      <option value="boardgame">桌遊挑戰</option>
    </select>
  </p>

  <fieldset>
    <legend>方便參加的日子（單選）</legend>
    <p><label><input type="radio" name="day" value="tuesday"> 星期二</label></p>
    <p><label><input type="radio" name="day" value="thursday"> 星期四</label></p>
    <p><label><input type="radio" name="day" value="friday"> 星期五</label></p>
  </fieldset>

  <fieldset>
    <legend>我期待的活動方式（可複選）</legend>
    <p><label><input type="checkbox" name="style" value="hands-on"> 動手製作</label></p>
    <p><label><input type="checkbox" name="style" value="cooperation"> 和同學合作</label></p>
    <p><label><input type="checkbox" name="style" value="sharing"> 上台分享</label></p>
  </fieldset>

  <!-- 自訂新增欄位：聯絡家長方式 -->
  <p>
    <label for="parent-notice">通知家長方式</label><br>
    <select id="parent-notice" name="parent_notice">
      <option value="">請選擇通知方式</option>
      <option value="paper">紙本通知單</option>
      <option value="digital">學校 APP 電子通知</option>
    </select>
  </p>
  <p>說明：選擇「下拉選單」元件是為了讓國小學生能快速從限定的兩種既定管道（紙本通知或學校 APP）中做選擇，既不會因為手寫填錯聯絡方式，又能方便老師後續統整發放通知的管道。</p>

  <p>
    <label for="message">想告訴老師的事</label><br>
    <textarea id="message" name="message" rows="5" cols="32" placeholder="例如：我想和同學一起完成一個小作品"></textarea>
  </p>

  <button type="button" disabled>練習版，尚未開放報名</button>
 
</body>
</html>
